databases:
  - name: mirrorfit-db
    databaseName: mirrorfit
    user: mirrorfit_user
    plan: free

services:
  - type: web
    name: mirrorfit-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd api && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mirrorfit-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: web
    name: mirrorfit-ui
    env: node
    plan: free
    buildCommand: cd ui && npm install && npm run build
    startCommand: cd ui && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
